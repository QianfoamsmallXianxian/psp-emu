name: Build

on:
  push:
    branches:
    - master
    tags:
      - "v*.*"
    paths-ignore:
    - '*.{txt,md}'
    - 'Tools/**'
    - '.{editorconfig,gitattributes,gitignore}'
    - 'appveyor.yml'
  pull_request:
    branches:
    - master
    paths-ignore:
    - '*.{txt,md}'
    - 'Tools/**'
    - '.{editorconfig,gitattributes,gitignore}'
    - 'appveyor.yml'
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Build Variant'
        required: true
        default: 'NormalDebug'
        options:
        - NormalOptimized
        - NormalDebug
        - VROptimized
        - VRDebug
        - LegacyOptimized

env:
  BUILD_CONFIGURATION: Release

jobs:
  android:
    name: Android APK (${{ github.event.inputs.buildVariant || 'NormalDebug' }})
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Check Valid Version Tags
      id: valid-tags
      shell: bash
      run: |
        echo "count=$(git tag -l 'v[0-9]*' | wc -l | tr -d ' ')" >> $GITHUB_OUTPUT

    - name: Fetch upstream tags
      # Required so git describe returns a valid version instead of crashing on a fresh fork.
      if: steps.valid-tags.outputs.count == '0'
      run: |
        git remote add upstream https://github.com/hrydgard/ppsspp.git
        git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

    - name: Setup JDK
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Assemble APK
      run: ./gradlew assemble${{ github.event.inputs.buildVariant || 'NormalDebug' }} --stacktrace

    - name: Package APK
      run: |
        find android/build -name '*.apk' -type f
        mkdir -p ppsspp
        find android/build -name '*.apk' -type f -exec cp -v {} ppsspp/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: android-${{ github.event.inputs.buildVariant || 'NormalDebug' }} apk
        path: ppsspp/
        if-no-files-found: error
