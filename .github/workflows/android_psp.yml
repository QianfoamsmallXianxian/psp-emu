name: Android PSP

on:
  push:
    branches:
      - psp
  pull_request:
    branches:
      - psp
  workflow_dispatch:

jobs:
  build:
    name: Android NormalDebug arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch tags
        run: |
          git fetch --deepen=15000 --no-recurse-submodules --tags || true

      - name: Fetch latest upstream version
        id: ver
        run: |
          TAG=$(curl -s https://api.github.com/repos/hrydgard/ppsspp/releases/latest | grep -o '"tag_name": *"[^"]*"' | head -1 | sed 's/.*"tag_name": *"//; s/"//')
          if [ -z "$TAG" ]; then
            TAG=$(curl -s 'https://api.github.com/repos/hrydgard/ppsspp/tags?per_page=1' | grep -o '"name": *"[^"]*"' | head -1 | sed 's/.*"name": *"//; s/"//')
          fi
          if [ -z "$TAG" ]; then TAG="v0.0.1"; fi
          VER="${TAG#v}"
          MAJOR=$(echo "$VER" | cut -d. -f1); MAJOR=${MAJOR:-0}
          MINOR=$(echo "$VER" | cut -d. -f2); MINOR=${MINOR:-0}
          PATCH=$(echo "$VER" | cut -d. -f3); PATCH=${PATCH:-0}
          CODE=$((MAJOR*1000000 + MINOR*10000 + PATCH*100))
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$VER" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "Upstream version: $TAG  name=$VER  code=$CODE"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          ls -la android/debug.keystore

      - name: Patch abiFilters to arm64-v8a only
        run: |
          sed -i 's/abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a", "x86_64"))/abiFilters.addAll(listOf("arm64-v8a"))/g' android/build.gradle.kts
          sed -i 's/abiFilters.addAll(listOf("armeabi-v7a", "arm64-v8a"))/abiFilters.addAll(listOf("arm64-v8a"))/g' android/build.gradle.kts
          grep -n 'abiFilters' android/build.gradle.kts

      - name: Assemble NormalDebug APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew clean assembleNormalDebug -PANDROID_VERSION_CODE=${{ steps.ver.outputs.code }} -PANDROID_VERSION_NAME=${{ steps.ver.outputs.name }} --stacktrace

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find android/build -name '*.apk' -type f -exec cp -v {} out/ \; 2>/dev/null || true
          cd out && for f in *.apk; do mv "$f" "PSP-${{ steps.ver.outputs.name }}-arm64-v8a.apk" 2>/dev/null || true; done
          ls -la

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSP-${{ steps.ver.outputs.name }}-arm64-v8a
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14
